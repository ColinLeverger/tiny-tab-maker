# Deploy the static site to GitHub Pages on every push to main.
# Settings -> Pages -> Source: "GitHub Actions" to enable this.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Give the worker, loaded page and network-only version check one shared
      # release identity. The timestamp is rendered in the user's local time.
      - name: Stamp release version
        run: |
          sha="${{ github.sha }}"
          deployed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sed -i "s/^var VERSION = .*/var VERSION = \"ttm-$sha\";/" sw.js
          sed -i "s/data-build=\"[^\"]*\"/data-build=\"$sha\"/" index.html
          printf '{"sha":"%s","deployedAt":"%s"}\n' "$sha" "$deployed_at" > version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .            # the whole repo is the static site
      - id: deployment
        uses: actions/deploy-pages@v4
