# Deploy the static site to GitHub Pages on every push to main.
# Settings -> Pages -> Source: "GitHub Actions" to enable this.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Auto-version the service worker: every deploy gets its own cache name,
      # so nobody ever has to bump VERSION by hand.
      - name: Stamp SW version with commit SHA
        run: sed -i 's/^var VERSION = .*/var VERSION = "ttm-${{ github.sha }}";/' sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .            # the whole repo is the static site
      - id: deployment
        uses: actions/deploy-pages@v4
